name: 📱 Build Android APK (ItaliaBus Mobile)

on:
  push:
    paths:
      - 'app_android_python/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compila APK Android con Flet & Python
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installa Dipendenze e Flet CLI
        run: |
          pip install --upgrade pip
          pip install flet
          pip install -r app_android_python/requirements.txt

      - name: 🚀 Compila APK Android (Flet Build APK)
        working-directory: ./app_android_python
        run: |
          flet build apk --yes --no-rich-output

      - name: 📤 Carica APK come Artifact Scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: ItaliaBus-Mobile-APK
          path: app_android_python/build/apk/*.apk
          if-no-files-found: warn
